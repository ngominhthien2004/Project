name: comicweb-docker

services:
  mongodb:
    image: mongo:7.0
    container_name: comicweb-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ngominhthien2222
      MONGO_INITDB_ROOT_PASSWORD: ngominhthien
      MONGO_INITDB_DATABASE: comicWebDB
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
