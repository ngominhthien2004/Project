name: comicweb-docker

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: comicweb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - comicweb-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: comicweb-server
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/comicWebDB
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./server/src:/app/src
      - ./server/node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - comicweb-network

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: comicweb-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - comicweb-network

volumes:
  mongodb_data:

networks:
  comicweb-network:
    driver: bridge
